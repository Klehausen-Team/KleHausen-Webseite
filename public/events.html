<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Events</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav>
        <div class="container">
            <div class="nav-links">
                <a href="/index.html">Home</a>
                <a href="/projects.html">Projects</a>
                <a href="/events.html" class="active">Events</a>
                <a href="/socials.html">Socials</a>
                <a href="https://ticket.klehausen.de">Contact</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <h1>Upcoming Events</h1>
        <div id="eventsContainer"></div>
    </main>

    <div class="theme-toggle">
        <button id="themeToggle" class="button">🌓</button>
    </div>

    <script src="/js/theme.js"></script>
    <script>
        async function loadEvents() {
            try {
                const response = await fetch('/api/events');
                const events = await response.json();
                const container = document.getElementById('eventsContainer');
                
                container.innerHTML = events
                    .filter(event => event.status === 1) // Only show scheduled events
                    .sort((a, b) => a.start - b.start)
                    .map(event => createEventCard(event))
                    .join('');

                startTimerUpdates();
                
            } catch (error) {
                console.error('Error loading events:', error);
            }
        }

        function createEventCard(event) {
            const now = Date.now();
            const startDate = new Date(event.start);
            const endDate = new Date(event.end);
            
            const isLive = now > event.start && now < event.end;
            const isEnded = now > event.end;
            const timeUntil = calculateTimeDifference(now, event.start);

            return `
                <div class="card">
                    ${event.image ? `
                    <a href="${event.url}" target="_blank" rel="noopener">
                        <img src="${event.image}" 
                            alt="${event.title}" 
                            class="event-image"
                            loading="lazy">
                    </a>` : ''}
                    <h2>${event.title}</h2>
                    <p>${event.description}</p>
                    
                    <div class="time-info">
                        <div class="event-countdown">
                            <div class="time-group">
                                <span>📅 Starts:</span>
                                <time datetime="${startDate.toISOString()}">
                                    ${formatDateTime(startDate)}
                                </time>
                            </div>
                            <div class="time-group">
                                <span>📅 Ends:</span>
                                <time datetime="${endDate.toISOString()}">
                                    ${formatDateTime(endDate)}
                                </time>
                            </div>
                        </div>
                        
                        <div class="event-countdown">
                            <div class="time-badge">
                                ${calculateDuration(event.start, event.end)}
                            </div>
                            ${!isEnded ? `
                            <div class="time-badge ${isLive ? 'live' : ''}">
                                ${isLive ? 
                                    '🔴 Live Now - Ends in ' : 
                                    'Starts in '}
                                <span class="time-value">
                                    ${isLive ? 
                                        calculateTimeDifference(now, event.end) : 
                                        timeUntil}
                                </span>
                            </div>` : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        function calculateDuration(startTimestamp, endTimestamp) {
            const startDate = new Date(startTimestamp);
            const endDate = new Date(endTimestamp);
            
            // Calculate calendar days difference
            const startDay = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate());
            const endDay = new Date(endDate.getFullYear(), endDate.getMonth(), endDate.getDate());
            const dayDiff = Math.ceil((endDay - startDay) / (1000 * 60 * 60 * 24));
            
            // Calculate total hours
            const totalMs = endDate - startDate;
            const totalHours = Math.floor(totalMs / 3600000);
            
            // Calculate remaining hours after full calendar days
            const remainingHours = totalHours % 24;
            
            let durationParts = [];
            if (dayDiff > 0) {
                durationParts.push(`${dayDiff} day${dayDiff !== 1 ? 's' : ''}`);
            }
            if (remainingHours > 0 || dayDiff === 0) {
                durationParts.push(`${remainingHours} hour${remainingHours !== 1 ? 's' : ''}`);
            }
            
            return `Duration: ${durationParts.join(' ')}`;
        }

        function calculateTimeDifference(now, target) {
            const diff = target - now;
            if (diff < 0) return '0h';
            
            const days = Math.floor(diff / 86400000);
            const hours = Math.floor((diff % 86400000) / 3600000);
            
            return days > 0 ? `${days}d ${hours}h` : `${hours}h`;
        }

        function formatDateTime(date) {
            return date.toLocaleString('en-US', {
                month: 'short',
                day: 'numeric',
                hour: 'numeric',
                minute: '2-digit',
                hour12: true
            });
        }

        function startTimerUpdates() {
            setInterval(() => {
                document.querySelectorAll('.time-value').forEach(element => {
                    const eventCard = element.closest('.card');
                    const endTime = new Date(
                        eventCard.querySelector('time[datetime]').getAttribute('datetime')
                    );
                    const now = Date.now();
                    
                    element.textContent = calculateTimeDifference(now, endTime);
                });
            }, 60000);
        }

        loadEvents();
    </script>
</body>
</html>
