<!-- Simple SVG Icon for PWA -->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9533;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff7b00;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <dropshadow dx="2" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#grad1)" filter="url(#shadow)"/>
  
  <!-- KH Letters -->
  <g fill="white" font-family="Arial, sans-serif" font-weight="bold" font-size="160" text-anchor="middle">
    <text x="200" y="280">K</text>
    <text x="312" y="280">H</text>
  </g>
  
  <!-- Decorative Elements -->
  <circle cx="256" cy="140" r="12" fill="white" opacity="0.8"/>
  <circle cx="180" cy="160" r="8" fill="white" opacity="0.6"/>
  <circle cx="332" cy="160" r="8" fill="white" opacity="0.6"/>
  <circle cx="256" cy="380" r="10" fill="white" opacity="0.7"/>
</svg>
